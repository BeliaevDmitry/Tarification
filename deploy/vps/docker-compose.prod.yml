services:
  postgres:
    image: postgres:13
    container_name: ${STACK_NAME:-tarification}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: ${STACK_NAME:-tarification}-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}}
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?APP_ADMIN_USERNAME is required}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin}
      APP_ADMIN_FULL_NAME: ${APP_ADMIN_FULL_NAME:-Главный администратор}
      SCHOOL_CODE: ${SCHOOL_CODE:-}
      APP_DOMAIN: ${APP_DOMAIN:-}
      STACK_NAME: ${STACK_NAME:-}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_DEFAULT_RECIPIENTS: ${SMTP_DEFAULT_RECIPIENTS:-recipient1@example.com,recipient2@example.com}
      SMTP_DEFAULT_SUBJECT: ${SMTP_DEFAULT_SUBJECT:-Тарификация - автоматическая отправка}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-true}
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200}
    expose:
      - "8080"
    volumes:
      - pa_reports_data:/app/pa-reports
      - pa_specs_data:/app/pa-specifications
    restart: unless-stopped
    command: ["sh", "-c", "java $JAVA_OPTS -jar /app/app.jar"]

  caddy:
    image: caddy:2.8-alpine
    container_name: ${STACK_NAME:-tarification}-caddy
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      APP_UPSTREAM: app:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  pa_reports_data:
  pa_specs_data:
  caddy_data:
  caddy_config:
