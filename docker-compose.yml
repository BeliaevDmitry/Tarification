version: '3.8'
services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: tariffication_db
      POSTGRES_USER: tarif_user
      POSTGRES_PASSWORD: tarif_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarif_user -d tariffication_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: