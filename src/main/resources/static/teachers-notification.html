<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадровые документы</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="container"><header class="card"><h1>Кадровые документы</h1><nav class="page-nav"></nav></header>
<section class="card"><div class="hr-tabs"><button data-tab="journal">Журнал</button><button data-tab="memos">Служебные записки</button><button data-tab="notifications">Уведомления</button><button data-tab="catalog">Справочники</button><button data-tab="personal">Персональные данные</button></div></section>
<section id="journal" class="card hr-panel"><div class="toolbar"><input id="journal-search" placeholder="ФИО, договор или статус"><select id="journal-status"><option value="">Все статусы</option><option>Заполнить данные</option><option>Создать черновик</option><option>Требуется решение</option></select><button id="add-contract">Добавить договор</button><button id="reload-journal">Обновить</button></div><div class="table-scroll"><table class="sheet-table"><thead><tr><th>ФИО</th><th>Трудовой договор</th><th>Должность</th><th>Действующие документы</th><th>Требуется</th><th>Действия</th></tr></thead><tbody id="journal-body"></tbody></table></div></section>
<section id="memos" class="card hr-panel" hidden><div class="toolbar"><button id="add-memo">Создать общую служебку</button></div><table class="sheet-table"><thead><tr><th>Дата</th><th>Название</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="memo-body"></tbody></table></section>
<section id="notifications" class="card hr-panel" hidden><div class="toolbar"><label>Дата уведомления <input id="notification-date" type="date"></label><label>Дата нагрузки <input id="load-date" type="date"></label><button id="all">Сформировать все и скачать ZIP</button></div><table class="sheet-table"><thead><tr><th>ФИО</th><th>Статус</th><th></th></tr></thead><tbody id="tb"></tbody></table></section>
<section id="catalog" class="card hr-panel" hidden><div class="toolbar"><button id="add-catalog">Добавить выплату или работу</button></div><table class="sheet-table"><thead><tr><th>Название</th><th>Категория</th><th>Пункт</th><th>Сумма</th><th>Отдельный допник</th></tr></thead><tbody id="catalog-body"></tbody></table></section>
<section id="personal" class="card hr-panel" hidden><p>Импорт соединяет строки по постоянному ID педагога и может заполнять или обновлять данные.</p><div class="toolbar"><a class="button" href="/api/hr-documents/personal-data/template">Скачать шаблон</a><a class="button" href="/api/hr-documents/personal-data/export">Экспорт</a><label class="button">Импорт Excel<input id="personal-import" type="file" accept=".xlsx,.xls" hidden></label></div></section>
</main>
<dialog id="editor"><form method="dialog" id="editor-form"><h2 id="editor-title"></h2><div id="editor-fields" class="form-grid"></div><p id="editor-error" class="error"></p><div class="toolbar"><button value="cancel">Отмена</button><button id="editor-save" value="default">Сохранить</button></div></form></dialog>
<script src="/auth.js"></script><script src="/teachers-notification.js"></script></body></html>
