<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВСОКО / ПА — Спецификации</title>

    <link rel="icon" type="image/png" href="/school-crest.png">
<link rel="stylesheet" href="/styles.css" />
  <style>
    .sticky-head thead th { position: sticky; top: 0; background: #f1f1f1; z-index: 3; }
    .pa-sticky-table-wrap { max-height: 70vh; overflow: auto; }
    .summary-status-btn.inactive { color: #8a8f98; }
    .summary-status-btn.conflict { background: #ffe3e3; border-color: #dc2626; }
    #pa-summary-status-dialog table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    #pa-summary-status-dialog th, #pa-summary-status-dialog td { border: 1px solid #d8d8d8; padding: 6px 8px; text-align: left; }
    #pa-summary-status-dialog menu { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 0 0; margin: 0; }
  </style>
</head>
<body>
<main class="container">
  <header class="card app-shell-header">
    <h1>ВСОКО / ПА — Спецификации</h1>
    <nav class="page-nav"></nav>
  </header>

  <section class="card tab-panel" id="pa-tab-specs">
    <h2>Спецификации работ</h2>
    <div class="row" data-requires-edit>
      <input id="pa-spec-files" type="file" multiple accept=".xlsx">
      <button id="pa-spec-import-btn" type="button">Загрузить спецификации</button>
      <button id="pa-spec-reload-btn" type="button" data-allow-readonly="true">Обновить свод</button>
      <span id="pa-problem-counter" class="muted">Проблем: 0</span>
    </div>
    <div class="tabs" id="pa-spec-tabs">
      <button class="tab-btn active" type="button" data-spec-tab="summary-5-11">Свод 5-11</button>
      <button class="tab-btn" type="button" data-spec-tab="summary-1-4">Свод 1-4</button>
      <button class="tab-btn" type="button" data-spec-tab="registry">Спецификации</button>
      <button class="tab-btn" type="button" data-spec-tab="upload-log">Результат загрузки файлов</button>
    </div>

    <div id="pa-spec-summary-5-11-panel" class="tab-panel">
      <div class="pa-sticky-table-wrap">
        <table class="sheet-table sticky-head">
          <thead id="pa-matrix-head"></thead>
          <tbody id="pa-matrix-body"></tbody>
        </table>
      </div>
    </div>

    <div id="pa-spec-summary-1-4-panel" class="tab-panel hidden">
      <div class="pa-sticky-table-wrap">
        <table class="sheet-table sticky-head">
          <thead id="pa-matrix-head-primary"></thead>
          <tbody id="pa-matrix-body-primary"></tbody>
        </table>
      </div>
    </div>

    <div id="pa-spec-registry-panel" class="tab-panel hidden">
      <div class="pa-sticky-table-wrap">
        <table class="sheet-table sticky-head">
          <thead>
          <tr>
            <th>Предметная область</th><th>Предмет</th><th>Параллель</th><th>Уровень</th><th>Тип</th><th>Версия</th><th>Файл</th><th>Участвует</th><th>Удалить</th>
          </tr>
          </thead>
          <tbody id="pa-specifications-body"></tbody>
        </table>
      </div>
    </div>

    <div id="pa-spec-upload-log-panel" class="tab-panel hidden">
      <div class="pa-sticky-table-wrap">
        <table class="sheet-table sticky-head">
          <thead>
          <tr><th>Дата</th><th>Файл</th><th>Предмет</th><th>Параллель</th><th>Статус</th><th>Сообщение</th><th>Записей</th></tr>
          </thead>
          <tbody id="pa-spec-import-log-body"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>
<dialog id="pa-summary-status-dialog">
  <h3 id="pa-summary-status-title">Статус спецификаций</h3>
  <p id="pa-summary-status-scope" class="muted"></p>
  <p><strong>Классы по УП:</strong> <span id="pa-summary-status-classes">—</span></p>
  <table>
    <thead><tr><th>Тип работы</th><th>Участвует в ВСОКО</th></tr></thead>
    <tbody>
    <tr><td>Входная</td><td><label><input id="pa-summary-status-entry-check" type="checkbox" checked> Да</label></td></tr>
    <tr><td>Выходная</td><td><label><input id="pa-summary-status-exit-check" type="checkbox" checked> Да</label></td></tr>
    </tbody>
  </table>
  <table>
    <thead><tr><th>Класс</th><th>Уровень входной</th><th>Уровень выходной</th></tr></thead>
    <tbody id="pa-summary-level-assignments-body"></tbody>
  </table>
  <menu>
    <button id="pa-summary-status-save-btn" type="button">Сохранить</button>
    <button id="pa-summary-status-close-btn" type="button">Закрыть</button>
  </menu>
</dialog>
<script src="/auth.js"></script>
<script src="/vsoko-pa.js"></script>
</body>
</html>
