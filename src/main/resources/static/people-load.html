<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГБОУ школа 7 — Нагрузка по людям</title>

    <link rel="icon" type="image/png" href="/school-crest.png">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="load-page people-load-page">
<main class="container">
    <header class="card">
        <h1>Нагрузка по людям</h1>
        <p class="muted compact-note">Выберите весь корпус или конкретный адрес, чтобы увидеть нагрузку каждого педагога в формате полного экспорта и при необходимости скачать книгу.</p>
        <nav class="page-nav">
            <a class="nav-link" href="/buildings.html" data-tab="BUILDINGS">Корпуса</a>
            <a class="nav-link" href="/classes.html" data-tab="CLASSES">Классы</a>
            <a class="nav-link" href="/subjects.html" data-tab="SUBJECTS">Предметы</a>
            <a class="nav-link" href="/curriculum.html" data-tab="CURRICULUM">Учебный план</a>
            <a class="nav-link" href="/load.html" data-tab="LOAD">Нагрузка по корпусам</a>
            <a class="nav-link active" href="/people-load.html" data-tab="LOAD">Нагрузка по людям</a>
            <a class="nav-link" href="/load-statistics.html" data-tab="LOAD">Статистика нагрузки</a>
            <a class="nav-link" href="/settings.html" data-tab="SETTINGS">Настройки</a>
        </nav>
    </header>

    <section class="card load-toolbar people-load-toolbar">
        <div class="row load-main-row">
            <strong>Корпус:</strong>
            <select id="people-load-building-select" class="building-select"></select>
            <button id="people-load-refresh-btn" type="button">Обновить</button>
            <button id="export-full-load-btn" type="button" data-allow-readonly="true">Экспорт полной нагрузки</button>
        </div>
        <p id="people-load-summary" class="muted compact-note">Загрузка данных…</p>
    </section>

    <section class="card people-load-card">
        <div class="sheet-wrap people-load-wrap" data-scroll-controls="off">
            <table id="people-load-table" class="sheet-table people-load-table"></table>
        </div>
    </section>
</main>

<script src="/auth.js"></script>
<script src="/table-scroll.js"></script>
<script src="/people-load.js"></script>
<script src="/branding.js"></script>
</body>
</html>
