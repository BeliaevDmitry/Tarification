<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>

    <link rel="icon" type="image/png" href="/school-crest.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
<main class="container">
    <section class="card login-card">
        <div class="login-crest-wrap">
            <img src="/school-crest.png" alt="Герб школы" class="login-crest">
        </div>
        <h1 data-branding-login-title>Вход в систему</h1>
        <p class="muted">Войдите под своей учетной записью. Пользователей создаёт администратор.</p>
        <form id="login-form" class="grid">
            <input id="login-username" name="username" placeholder="Логин" autocomplete="username" required>
            <div class="login-password-field">
                <input id="login-password" name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
                <button id="login-password-toggle" class="login-password-toggle" type="button"
                        aria-controls="login-password" aria-pressed="false"
                        aria-label="Показать пароль" title="Показать пароль">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                        <circle cx="12" cy="12" r="2.75"></circle>
                        <path class="login-password-slash" d="m4 4 16 16"></path>
                    </svg>
                </button>
            </div>
            <button type="submit">Войти</button>
        </form>
        <pre id="login-result"></pre>
        <p class="muted">Если входите впервые, используйте временный пароль, который выдаст администратор.</p>
        <div class="login-quick-links">
            <a class="login-quick-tile" href="/request-exit.html">Подать заявку на выход</a>
            <a class="login-quick-tile" href="/pa.html">ПА</a>
        </div>
    </section>
</main>
<script src="/branding.js"></script>
<script src="/login.js"></script>
</body>
</html>
