<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВСОКО / ПА — Выходные работы</title>

    <link rel="icon" type="image/png" href="/school-crest.png">
<link rel="stylesheet" href="/styles.css" />
  <style>
    .sticky-head thead th { position: sticky; top: 0; background: #f1f1f1; z-index: 3; }
    .pa-sticky-table-wrap { max-height: 70vh; overflow: auto; }
    .pa-workflow-table .workflow-col-area,
    .pa-workflow-table .workflow-col-subject,
    .pa-workflow-table .workflow-col-status { position: sticky; background: #f8fafc; z-index: 2; }
    .pa-workflow-table .workflow-col-area { left: 0; min-width: 180px; z-index: 4; }
    .pa-workflow-table .workflow-col-subject { left: 180px; min-width: 180px; z-index: 4; }
    .pa-workflow-table .workflow-col-status { left: 360px; min-width: 120px; z-index: 4; }
  </style>
</head>
<body>
<main class="container">
  <header class="card app-shell-header">
    <h1>ВСОКО / ПА — Выходные работы</h1>
    <nav class="page-nav"></nav>
  </header>

  <section class="card" id="pa-tab-exit">
    <h2>Выходные работы</h2>
    <p class="muted">Генерация отчётов по спецификациям и контроль статусов.</p>
    <div class="row">
      <select id="pa-exit-subject"></select>
      <select id="pa-exit-scope"></select>
      <select id="pa-exit-class"></select>
      <select id="pa-exit-level">
        <option value="BASIC">Базовый</option>
        <option value="ADVANCED">Углублённый</option>
      </select>
      <input id="pa-exit-work-date" type="date">
      <button id="pa-exit-generate-all-btn" type="button" data-requires-edit>Сгенерировать все</button>
      <button id="pa-exit-regenerate-all-btn" type="button" data-requires-edit>Перегенерировать всё/предмет</button>
      <button id="pa-exit-generate-parallel-btn" type="button" data-requires-edit>Сгенерировать параллель</button>
      <button id="pa-exit-generate-btn" type="button" data-requires-edit>Сгенерировать для класса</button>
      <button id="pa-exit-delete-scope-btn" type="button" data-requires-edit>Удалить класс/параллель</button>
    </div>

    <h3>Результат генерации</h3>
    <div class="pa-sticky-table-wrap">
      <table class="sheet-table sticky-head">
        <thead><tr><th>Файл</th><th>Статус</th><th>Причина/сообщение</th><th>Версия</th></tr></thead>
        <tbody id="pa-exit-upload-log-body"></tbody>
      </table>
    </div>

    <div class="pa-sticky-table-wrap">
      <div class="tabs" id="pa-exit-range-tabs">
        <button class="tab-btn" type="button" data-workflow-range="1-4">1–4 классы</button>
        <button class="tab-btn active" type="button" data-workflow-range="5-11">5–11 классы</button>
      </div>
      <div class="row" style="margin-bottom:8px;">
        <input id="pa-exit-workflow-filter" type="text" placeholder="Фильтр по предмету/области">
        <select id="pa-exit-workflow-page-size">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="50">50</option>
        </select>
        <button id="pa-exit-workflow-page-prev" type="button" data-allow-readonly="true">←</button>
        <span id="pa-exit-workflow-page-info" class="muted">Страница 1 из 1</span>
        <button id="pa-exit-workflow-page-next" type="button" data-allow-readonly="true">→</button>
      </div>
      <table class="sheet-table sticky-head pa-workflow-table">
        <thead id="pa-exit-workflow-head"></thead>
        <tbody id="pa-exit-workflow-body"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/auth.js"></script>
<script src="/vsoko-pa.js"></script>
</body>
</html>
