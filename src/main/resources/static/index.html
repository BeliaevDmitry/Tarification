<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarification — ручной ввод</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="container">
    <header class="card">
        <h1>Tarification — ручной режим</h1>
        <p class="muted">Ручная загрузка нагрузки.</p>
        <p id="mode-badge" class="mode-badge">Режим: определяем...</p>
        <nav class="page-nav">
            <a class="nav-link" href="/buildings.html">Корпуса</a>
            <a class="nav-link" href="/classes.html">Классы</a>
            <a class="nav-link" href="/curriculum.html">Учебный план</a>
            <a class="nav-link" href="/load.html">Нагрузка по корпусам</a>
            <a class="nav-link" href="/teachers.html">Педагоги</a>
        </nav>
        <div id="auth-slot"></div>
    </header>

    <section class="card">
        <h2>Ручная нагрузка</h2>
        <form id="manual-load-form" class="grid">
            <input name="fioTeacher" placeholder="ФИО педагога" required>
            <input name="numberSchoolBuilding" placeholder="Корпус" required>
            <input name="subjectName" placeholder="Предмет" required>
            <input name="className" placeholder="Класс (УП)" required>
            <input name="load" type="number" min="1" placeholder="Нагрузка" required>
            <input name="groupNameEducationalPlan" placeholder="Группа (УП), можно пусто">
            <input name="groupLoad" type="number" min="1" placeholder="Нагрузка группы, можно пусто">
            <select name="educationLevel" required>
                <option value="BASIC">Базовый</option>
                <option value="ADVANCED">Углублённый</option>
            </select>
            <button type="submit">Сохранить запись</button>
        </form>
        <pre id="manual-load-result"></pre>

        <hr>

        <button id="process-btn">Запустить обработку</button>
        <pre id="process-result"></pre>
    </section>
</main>

<script src="/app.js"></script>
<script src="/auth.js"></script>
<script>window.initAuth && initAuth().catch(() => {});</script>
</body>
</html>
