<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВСОКО / ПА — Сдача ПА</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .sticky-head thead th { position: sticky; top: 0; background: #f1f1f1; z-index: 3; }
    .pa-sticky-table-wrap { max-height: 70vh; overflow: auto; }
  </style>
</head>
<body>
<main class="container">
  <header class="card app-shell-header">
    <div class="header-title-row">
      <h1>ВСОКО / ПА — Сдача ПА</h1>
      <div class="header-user-inline">
        <a class="nav-link" href="/vsoko-pa.html">← Вернуться к ПА</a>
      </div>
    </div>
    <nav class="page-nav" id="pa-sub-pages-nav">
      <a class="nav-link" data-pa-page="spec" href="/vsoko-pa-spec.html">Спецификации</a>
      <a class="nav-link" data-pa-page="entry" href="/vsoko-pa-entry.html">Входные работы</a>
      <a class="nav-link" data-pa-page="exit" href="/vsoko-pa-exit.html">Выходные работы</a>
      <a class="nav-link" data-pa-page="folders" href="/vsoko-pa-folders.html">Отчёты по папкам</a>
      <a class="nav-link" data-pa-page="upload" href="/vsoko-pa-upload.html">Сдача ПА</a>
    </nav>
  </header>

  <section class="card">
    <h2>Сдача ПА</h2>
    <div class="row">
      <select id="pa-exit-subject"></select>
      <select id="pa-exit-scope"></select>
      <select id="pa-exit-class"></select>
      <select id="pa-exit-level"><option value="BASIC">Базовый</option><option value="ADVANCED">Углублённый</option></select>
      <input id="pa-exit-work-date" type="date">
      <button id="pa-exit-load-versions-btn" type="button" data-allow-readonly="true">Показать версии</button>
    </div>
    <div class="row" data-requires-edit>
      <input id="pa-exit-report-files" type="file" multiple accept=".xlsx">
      <button id="pa-exit-upload-btn" type="button">Сдать отчёт(ы)</button>
    </div>

    <div class="pa-sticky-table-wrap">
      <table class="sheet-table sticky-head">
        <thead><tr><th>Файл</th><th>Статус</th><th>Причина/сообщение</th><th>Версия</th></tr></thead>
        <tbody id="pa-exit-upload-log-body"></tbody>
      </table>
    </div>

    <div class="pa-sticky-table-wrap">
      <table class="sheet-table sticky-head">
        <thead><tr><th>Версия</th><th>Статус</th><th>Активна</th><th>Файл</th><th>Дата</th><th>Причина</th></tr></thead>
        <tbody id="pa-exit-versions-body"></tbody>
      </table>
    </div>
  </section>
</main>
<script src="/auth.js"></script>
<script src="/vsoko-pa.js"></script>
</body>
</html>
