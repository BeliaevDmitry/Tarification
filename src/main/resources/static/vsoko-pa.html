<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВСОКО — ПА</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="container">
    <header class="card app-shell-header">
        <div class="header-title-row">
            <h1>ВСОКО / ПА</h1>
            <div class="header-user-inline">
                <a class="home-link" href="/vsoko.html" title="ВСОКО">←</a>
            </div>
        </div>
        <p class="muted">Выберите раздел ПА.</p>
    </header>

    <section class="card">
        <div class="pa-hub-grid" id="pa-hub-grid">
            <a class="pa-hub-tile" href="/vsoko-pa-spec.html">Спецификации</a>
            <a class="pa-hub-tile" href="/vsoko-pa-entry.html">Входные работы</a>
            <a class="pa-hub-tile" href="/vsoko-pa-exit.html">Выходные работы</a>
            <a class="pa-hub-tile" href="/vsoko-pa-folders.html">Отчёты по папкам</a>
            <a class="pa-hub-tile" href="/vsoko-pa-upload.html">Сдача ПА</a>
        </div>
    </section>
</main>
<script>
(() => {
    const search = window.location.search || '';
    document.querySelectorAll('#pa-hub-grid a[href^="/vsoko-pa-"]').forEach((link) => {
        const url = new URL(link.getAttribute('href'), window.location.origin);
        url.search = search;
        link.href = url.pathname + url.search;
    });
})();
</script>
</body>
</html>
