<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarification — ВСОКО / ОГЭ</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .tabs button { padding:8px 12px; border:1px solid #bbb; background:#f5f5f5; cursor:pointer; }
        .tabs button.active { background:#dfefff; border-color:#7aa2d6; }
        .tab-pane { display:none; }
        .tab-pane.active { display:block; }
        .subtabs { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
        .subtabs button.active { background:#e9f7e9; }
        .compact-table { font-size:12px; }
        .compact-table th, .compact-table td { padding:4px 6px; white-space:nowrap; }
    </style>
</head>
<body>
<main class="container">
    <header class="card">
        <h1>ВСОКО / ОГЭ</h1>
        <a class="nav-link" href="/vsoko.html">← К плашкам ВСОКО</a>
    </header>

    <section class="card">
        <div class="tabs" id="main-tabs">
            <button data-tab="upload" class="active">Выгрузка</button>
            <button data-tab="students">Таблица учеников</button>
            <button data-tab="gia-stats">Статистика по выбору ГИА</button>
            <button data-tab="works">Внутренние работы</button>
            <button data-tab="scores">Баллы за задания</button>
        </div>

        <div id="tab-upload" class="tab-pane active">
            <h2>ОГЭ / Выгрузка</h2>
            <div class="inline-form" data-requires-edit>
                <input type="file" id="gia-files" multiple accept=".xlsx" data-allow-readonly="true">
                <button id="gia-upload-btn" type="button">Импорт выгрузки(ок)</button>
                <button id="gia-export-btn" type="button" data-allow-readonly="true">Скачать Excel (выгрузка ГИА)</button>
            </div>
            <div id="gia-upload-log" class="muted"></div>

            <h3>Изменения между двумя последними выгрузками</h3>
            <table class="compact-table">
                <thead><tr><th>Тип</th><th>Ключ</th><th>Было</th><th>Стало</th></tr></thead>
                <tbody id="changes-body"></tbody>
            </table>
        </div>

        <div id="tab-students" class="tab-pane">
            <h2>ОГЭ / Кто что сдаёт</h2>
            <div class="inline-form">
                <input id="students-search" placeholder="Поиск по ФИО" style="min-width:280px;">
            </div>
            <table class="compact-table">
                <thead><tr><th>Класс</th><th>ФИО</th><th>Кол-во предметов</th><th>Предметы</th></tr></thead>
                <tbody id="students-body"></tbody>
            </table>
        </div>

        <div id="tab-gia-stats" class="tab-pane">
            <h2>ОГЭ / Статистика по выбору ГИА</h2>
            <div id="exam-dist" class="muted"></div>
            <div style="overflow:auto;">
                <table class="compact-table">
                    <thead id="gia-stats-head"></thead>
                    <tbody id="gia-stats-body"></tbody>
                    <tfoot id="gia-stats-foot"></tfoot>
                </table>
            </div>
        </div>

        <div id="tab-works" class="tab-pane">
            <h2>ОГЭ / Внутренние работы</h2>
            <div class="inline-form" data-requires-edit>
                <input type="file" id="work-files" multiple accept=".xlsx" data-allow-readonly="true">
                <button id="work-upload-btn" type="button">Импорт работ</button>
                <button id="works-export-btn" type="button" data-allow-readonly="true">Скачать Excel (работы)</button>
            </div>
            <div id="work-upload-log" class="muted"></div>

            <div class="subtabs" id="works-tabs">
                <button data-subtab="results" class="active">Результаты</button>
                <button data-subtab="missing">Не сдали (нет результата)</button>
                <button data-subtab="stats">Статистика</button>
            </div>

            <div id="works-results" class="tab-pane active" style="display:block; overflow:auto;">
                <table class="compact-table" id="results-matrix"></table>
            </div>
            <div id="works-missing" class="tab-pane" style="overflow:auto;">
                <table class="compact-table">
                    <thead><tr><th>Предмет</th><th>Класс</th><th>ФИО</th></tr></thead>
                    <tbody id="missing-body"></tbody>
                </table>
            </div>
            <div id="works-stats" class="tab-pane" style="overflow:auto;">
                <table class="compact-table">
                    <thead><tr><th>Класс</th><th>Предмет</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead>
                    <tbody id="work-stats-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-scores" class="tab-pane">
            <h2>ОГЭ / Баллы за задания</h2>
            <button id="save-scale-btn" type="button" data-requires-edit>Сохранить шкалу</button>
            <div style="overflow:auto; max-height:560px; margin-top:8px;">
                <table id="scale-table" class="compact-table"></table>
            </div>
        </div>
    </section>
</main>
<script src="/auth.js"></script>
<script src="/vsoko-oge.js"></script>
</body>
</html>
