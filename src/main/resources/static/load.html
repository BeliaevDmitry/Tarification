<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarification — Нагрузка по корпусам</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="container">
    <header class="card">
        <h1>Нагрузка по корпусам</h1>
        <p class="muted">Нагрузка отображается в формате, близком к таблице: предмет, педагог и колонки по классам корпуса.</p>
        <nav class="page-nav">
            <a class="nav-link" href="/">Ручной ввод</a>
            <a class="nav-link" href="/mesh.html">Корректировка МЭШ</a>
            <a class="nav-link" href="/classes.html">Классы</a>
            <a class="nav-link" href="/buildings.html">Корпуса</a>
            <a class="nav-link" href="/curriculum.html">Учебные планы (как таблица)</a>
            <a class="nav-link active" href="/load.html">Нагрузка по корпусам</a>
            <a class="nav-link" href="/teachers.html">Педагоги</a>
        </nav>
    </header>

    <section class="card">
        <div class="row"><strong>Корпуса:</strong><div id="building-tabs" class="parallel-tabs"></div></div>
        <div class="row controls-row">
            <label>Сортировка:
                <select id="sort-field-select">
                    <option value="subject">по предмету</option>
                    <option value="teacher">по педагогу</option>
                    <option value="block">по блоку</option>
                    <option value="level">по уровню</option>
                    <option value="totalHours">по сумме часов</option>
                    <option value="classCount">по числу классов</option>
                </select>
            </label>
            <label>Порядок:
                <select id="sort-direction-select">
                    <option value="asc">по возрастанию</option>
                    <option value="desc">по убыванию</option>
                </select>
            </label>
            <button id="refresh-load-btn" type="button">Обновить из учебного плана</button>
            <button id="save-building-btn" type="button">Сохранить нагрузку корпуса</button>
        </div>
        <pre id="load-result"></pre>
    </section>

    <section class="card">
        <h2>Распределение педагогов</h2>
        <div class="sheet-wrap"><table class="sheet-table" id="building-load-table"><thead id="building-load-head"></thead><tbody id="building-load-body"></tbody></table></div>
    </section>
</main>
<script src="/load.js"></script>
</body>
</html>
